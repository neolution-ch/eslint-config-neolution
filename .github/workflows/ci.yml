name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "release/**"
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changeset-check:
    name: Changeset Check
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Activates the pnpm version pinned in the root manifest packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The Version Packages PR consumes the changesets it releases, so the check cannot pass on it. A branch name
      # alone is no proof (anyone can push a changeset-release/* branch), so the PR must also come from the bot.
      - name: Check for changesets
        if: ${{ !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.user.login == 'csag-changesets-bot[bot]') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec changeset status --since="origin/$BASE_REF"

  # Keep the job name: the branch ruleset requires the "Verify" check.
  verify:
    name: Verify
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # tsc builds dist, then ESLint lints this repository with the typescript preset from dist.
      - name: Lint with ESLint 10
        run: pnpm run lint

      - name: Pack
        run: pnpm pack

      # The config supports ESLint 9 and 10, whose type declarations differ, so tsc and the
      # lint run again against the newest ESLint 9.
      - name: Install ESLint 9
        run: pnpm add --save-dev eslint@9 # zizmor: ignore[adhoc-packages] the newest ESLint 9 within the minimumReleaseAge floor, installed in a job without credentials

      - name: Lint with ESLint 9
        run: pnpm run lint

  # Static analysis of the workflows themselves (template injection, unpinned actions,
  # excessive permissions). Findings fail the job.
  zizmor:
    name: zizmor
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
